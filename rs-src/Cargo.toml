[package]
name = "reqwest_labview"
version = "0.1.0"
edition = "2021"
description = "reqwest-based HTTP client shared library for LabVIEW"

[lib]
name = "reqwest_labview"
crate-type = ["cdylib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "rustls-tls-native-roots",
    "json",
] }
serde_json = "1"
once_cell = "1"

[build-dependencies]
cbindgen = "0.27"

# Embeds a VERSIONINFO resource in Windows DLLs. Host-gated because the
# Windows targets are only ever built on Windows runners.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
strip = true      # Strip debug symbols for smaller binaries
lto = true        # Link-time optimisation
